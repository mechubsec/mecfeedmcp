name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    # Default setup is already enabled on this repo. Uploading SARIF from
    # this advanced workflow is rejected ("analyses from advanced
    # configurations cannot be processed when the default setup is
    # enabled"), which failed the Analyze job. The queries still run here
    # so pull requests get a CodeQL check; results stay with default setup.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: false
