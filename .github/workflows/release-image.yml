name: Release container image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@78f0b978cf67ca10547cce4c15111eb7a872d886 # v0.33.2
    with:
      image: ghcr.io/${{ github.repository }}
      dockerhub-image: docker.io/mechub/mecfeedmcp
      description: 'Governed threat-intel feed MCP server'
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  scan:
    name: Scan pushed MCP image
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: Scan pushed image
        # The digest is a multi-arch manifest list, so scan each platform.
        # --image-src remote: a local daemon copy would silently win over --platform.
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --image-src remote --platform "${platform}" --scanners vuln --exit-code 1 --ignore-unfixed \
              "ghcr.io/${{ github.repository }}@${{ needs.release.outputs.digest }}"
          done

  tag-version:
    name: Resolve tag version
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  registry-publish:
    name: Publish to MCP Registry
    needs: [release, tag-version]
    permissions:
      contents: read
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-registry-publish.yml@39e7308cda922dadad18a0b0a5775ec1ab4a0bca # v0.32.0
    with:
      version: ${{ needs.tag-version.outputs.version }}
      oci-image: ghcr.io/${{ github.repository }}:${{ needs.tag-version.outputs.version }}
