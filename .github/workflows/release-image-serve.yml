name: Release feed server image

# Separate workflow from release-image.yml on purpose. Both call
# reusable-release-image.yml, whose SBOM job always uploads an artifact
# named sbom-cyclonedx. Two calls in one workflow run collide on that
# name (upload-artifact v7 refuses a second upload). A second workflow
# file is a second run, so the names do not meet.
#
# reusable-release-image.yml has a context input and no file input.
# smoke-test-command runs on every platform runner after that workflow's
# checkout and before that platform's build, so copying Dockerfile.serve
# over Dockerfile selects the feed server image on every leg. The per-
# platform digest artifacts collide across two calls in one run too.
#
# GHCR packages pushed with GITHUB_TOKEN must live under this repository:
# ghcr.io/mechubsec/mecfeedmcp/mecfeed-serve. Docker Hub is a separate
# repository, docker.io/mechub/mecfeed-serve.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-serve:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@ab6786faca282cfbfffed5668f6a15929ce26bef # v0.33.1
    with:
      image: ghcr.io/${{ github.repository }}/mecfeed-serve
      dockerhub-image: docker.io/mechub/mecfeed-serve
      description: 'Read-only TLS feed server firewalls pull from'
      smoke-test-command: cp Dockerfile.serve Dockerfile
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  scan-serve:
    name: Scan pushed feed-server image
    needs: release-serve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trivy 0.70.0
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: Scan pushed image
        # The digest is a multi-arch manifest list, so scan each platform.
        # --image-src remote: a local daemon copy would silently win over --platform.
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --image-src remote --platform "${platform}" --scanners vuln --exit-code 1 --ignore-unfixed \
              "ghcr.io/${{ github.repository }}/mecfeed-serve@${{ needs.release-serve.outputs.digest }}"
          done
