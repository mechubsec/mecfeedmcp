[workspace]
members = [
    "crates/mecfeedmcp-core",
    "crates/mecfeedmcp",
    "crates/mecfeed-serve",
]
default-members = [
    "crates/mecfeedmcp-core",
    "crates/mecfeedmcp",
    "crates/mecfeed-serve",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mechubsec/mecfeedmcp"
authors = ["fastrevmd-lab"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
http = "1"
ipnet = "2"
rand = "0.10"
rmcp = { version = ">=3.5.1,<4", features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustix = { version = "1", features = ["process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# mecmcp is consumed at an exact pinned version. Do not relax the tag.
mecmcp-audit = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-auth = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-changeset = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-redact = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-runtime = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-secret = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-server = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }
mecmcp-transport = { version = "0.28.1", git = "https://github.com/mechubsec/mecmcp", tag = "v0.28.1" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
